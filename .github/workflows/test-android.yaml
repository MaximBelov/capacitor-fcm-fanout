name: Android tests
# The Kotlin of android/ on the JVM with JUnit, against Capacitor's Android library from node_modules: the router against fake
# receivers, the receiver catalogue and the status check. Then the example app built with the plugin installed the way an app
# installs it, and its merged manifest checked for the plugin's messaging service. No emulator: a message from FCM needs a
# Firebase project and a device registered with it.
# Called by ci.yaml when something it covers changes, and for every push to main.
on:
  workflow_call:
jobs:
  # The plugin library built (debug and release, with lint) and its JUnit tests run. Capacitor 8 builds with Java 21.
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      # settings.gradle takes capacitor-android from node_modules
      - run: npm ci
      - run: npm run verify:android
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-report-android
          path: android/build/reports/tests
          if-no-files-found: ignore
  # The plugin as an app sees it: the example app installs it from the repository (file:..), `cap sync` registers it, and Gradle
  # builds a debug APK. This is what catches a plugin that compiles alone and not inside an app.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: npm ci
      - run: npm run build
      - run: npm run example:android:build
      - name: The plugin is registered in the app
        run: grep -q 'io.github.maximbelov.fcmfanout.FcmFanoutPlugin' example-app/android/app/src/main/assets/capacitor.plugins.json
      # The example has neither Airship nor Intercom, so besides Firebase's own fallback the plugin's service is the only
      # one on the messaging action.
      - name: The app's merged manifest has the plugin's messaging service and no other
        run: node scripts/check-messaging-services.mjs example-app/android/app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml
